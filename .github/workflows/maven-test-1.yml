name: Maven Test
run-name: ${{ github.actor }} is performing Maven Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
        #Builds and runs all tests
      
      - name: Run a single maven test class
        run: mvn test -Dtest=AdderTest
        #AdderTest is the class name not the file name. Don't include the file extension.

      - name: Run a single maven test
        run: mvn test -Dtest=AdderTest#shouldAddTwoNumbers
        #To run a specific test from a file write ClassName#TestName
